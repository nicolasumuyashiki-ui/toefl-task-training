<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Length Test 3 — TCK Workshop</title>
<script>
/* practice-test/test3/index.html は Task Training 内のスタブ。

   かつてはここに独自のログインフォームがあり、PT 専用の別 GAS（TT とは別の
   users シート）に対して認証していた。そのため
     ① パスワードが TT と二重管理になる
     ② ログイン後もパスワードを保持しない（Auth.save は userId/name/email のみ）
        ため、サーバ側で「本人であること」を検証できず、userId さえ分かれば
        他人の模試結果・回答が読めてしまう
   という問題があった。認証を TT に一本化し、ここは振り分けだけを行う。
   （2026-07-25 朝次監査 / PR #193 — 6-B の前提）

   通常の導線は TT ログイン → test-select.html → mic-check.html であり、
   このページはもともと直接 URL を叩いた場合しか表示されない。*/
(function () {
  var ttUser = null;
  try { ttUser = JSON.parse(sessionStorage.getItem('kickstart_user') || 'null'); } catch (e) {}
  if (!(ttUser && (ttUser.userId || ttUser.userName))) {
    location.replace('../../index.html');   // 未ログイン → TT ログインへ
    return;
  }
  // スタッフ用スキップ（?goto=speaking-lr 等）は従来どおり有効。
  var ALLOWED_SKIP = {
    'mic-check': 'mic-check.html',
    'reading':   'reading-intro.html',
    'listening': 'listening-intro.html',
    'writing':   'writing-intro.html',
    'speaking':  'speaking-intro.html',
    'speaking-lr': 'speaking-lr.html',
    'speaking-ti': 'speaking-ti.html',
    'results':   'results.html'
  };
  var skipTo = null;
  try { skipTo = new URLSearchParams(location.search).get('goto'); } catch (e) {}
  location.replace((skipTo && ALLOWED_SKIP[skipTo]) || 'mic-check.html');
})();
</script>
</head>
<body>
<noscript>
  <p>Please <a href="../../index.html">log in to TCK Workshop</a> to start the Full Length Test.</p>
</noscript>
<script defer src="../../js/tm-footer.js?v=20260817"></script>
</body>
</html>
