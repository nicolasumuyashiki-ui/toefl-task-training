*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope','Zen Kaku Gothic New','Noto Sans JP',sans-serif;background:#FBF6EC;min-height:100vh;display:flex;flex-direction:column;}
.top-nav{background:#002817;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;font-size:14px;flex-shrink:0;}
.nav-left{display:flex;align-items:center;gap:12px;}
.nav-left .section-label{font-weight:700;font-size:15px;}
.nav-left .divider{color:#5A6861;}
.nav-left .q-info{color:#5A6861;}
.nav-right{display:flex;align-items:center;gap:14px;}
.timer{font-family:'Courier New',monospace;font-size:15px;font-weight:700;min-width:40px;text-align:center;}
.timer.warning{color:#fc8181;animation:blink .5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.user-badge{width:28px;height:28px;border-radius:50%;background:#007646;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
.progress-bar{height:4px;background:#F5E9D3;flex-shrink:0;}
.progress-fill{height:100%;background:#007646;transition:width .3s;}
.start-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;}
.start-overlay.hidden{display:none;}
.start-card{background:#fff;border-radius:16px;padding:48px;text-align:center;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.start-card h2{font-size:22px;color:#0F1511;margin-bottom:12px;}
.start-card p{color:#5A6861;font-size:14px;margin-bottom:24px;line-height:1.6;}
.btn-start{background:#007646;color:#fff;border:none;padding:14px 40px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;}
.btn-start:hover{background:#3a7cc0;}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.audio-phase{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:#fff;margin:16px 24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.audio-phase img{max-height:420px;max-width:100%;border-radius:10px;object-fit:contain;}
.audio-status{margin-top:20px;display:flex;align-items:center;gap:10px;font-size:15px;color:#007646;font-weight:600;}
.pulse{width:10px;height:10px;border-radius:50%;background:#007646;animation:pulse-a 1s infinite;}
@keyframes pulse-a{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.3);}}
.question-phase{flex:1;display:none;margin:16px 24px;min-height:0;}
.q-split{display:flex;gap:0;height:100%;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;}
.q-left{width:50%;display:flex;align-items:center;justify-content:center;padding:24px;background:#FBF6EC;border-right:1px solid #F5E9D3;}
.q-left img{max-height:400px;max-width:100%;border-radius:10px;object-fit:contain;}
.q-right{width:50%;padding:32px;display:flex;flex-direction:column;justify-content:center;}
.q-label{font-size:12px;color:#007646;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.q-text{font-size:17px;color:#0F1511;font-weight:600;margin-bottom:24px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{display:flex;align-items:center;gap:14px;padding:14px 18px;border:2px solid #F5E9D3;border-radius:10px;cursor:pointer;transition:all .15s;font-size:14px;color:#5A6861;background:#fff;}
.option:hover{border-color:#007646;background:#F5E9D3;}
.option.selected{border-color:#007646;background:#F5E9D3;}
.option.selected .opt-letter{background:#007646;color:#fff;}
.opt-letter{width:28px;height:28px;border-radius:50%;border:2px solid #D6DAD7;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#5A6861;flex-shrink:0;transition:all .15s;}
.opt-text{flex:1;line-height:1.4;}
.completion{flex:1;display:none;align-items:center;justify-content:center;padding:40px;}
.completion-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);max-width:600px;width:100%;padding:40px;text-align:center;}
.completion-card h2{font-size:22px;color:#0F1511;margin:12px 0 8px;}
.score-display{font-size:48px;font-weight:700;color:#007646;margin:16px 0;}
.result-grid{text-align:left;margin:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.result-item{padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;}
.result-item.correct{background:#f0fff4;color:#276749;}
.result-item.incorrect{background:#FDF4F0;color:#8A3E24;}
.btn-answers{display:inline-block;margin-top:20px;padding:14px 36px;background:#007646;color:#fff;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;}
.btn-answers:hover{background:#3a7cc0;}
.footer-nav{background:#fff;border-top:1px solid #F5E9D3;padding:12px 24px;display:flex;justify-content:flex-end;align-items:center;flex-shrink:0;}
.btn-next{padding:10px 28px;background:#007646;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;opacity:.5;pointer-events:none;transition:opacity .2s;}
.btn-next.active{opacity:1;pointer-events:auto;}
.btn-next:hover{background:#3a7cc0;}
@media(max-width:600px){/*mtopnav*/.top-nav{padding:8px 12px!important;flex-wrap:wrap!important;row-gap:6px!important}.top-nav .nav-left,.top-nav .nav-right{gap:8px!important}.top-nav .section-label,.top-nav .divider{display:none!important}}
</style>

/* ===== CONVERSATION AUDIO (placeholder) ===== */
const convAudio = ["../../audio/conv/practice-1/convAudio0.mp3","../../audio/conv/practice-1/convAudio1.mp3"];

/* ===== QUESTIONS ===== */
const questions = [
    {conv:0, text:"Why does the student visit the IT help desk?",
     options:[
            "To report a stolen laptop on campus.",
            "To install new software on her computer.",
            "To request a new student ID card.",
            "To get help connecting to the campus Wi-Fi."],
     correct:3},
    {conv:0, text:"What will the staff member do for the student?",
     options:[
            "Reset her network password and send a monthly reminder.",
            "Replace her laptop battery right away.",
            "Give her a temporary Wi-Fi hotspot device.",
            "Schedule a follow-up appointment for tomorrow."],
     correct:0},
    {conv:1, text:"What can be inferred about why the student needs the third edition?",
     options:[
            "The second edition contains too many errors.",
            "His professor requires it because the chapters were reorganized.",
            "The third edition is cheaper than the second.",
            "The bookstore no longer carries the second edition."],
     correct:1},
    {conv:1, text:"What will the student most likely do next?",
     options:[
            "Return the book and wait for a full refund.",
            "Buy the second edition for the whole semester.",
            "Read the second edition until Wednesday and then exchange it.",
            "Order the book from a different online bookstore."],
     correct:2}
];

/* ===== STATE ===== */
const labels = ['A','B','C','D'];
let currentQ = -1;
let currentConv = -1;
let userAnswers = [null,null,null,null];
let timerInterval = null;
let secondsLeft = 0;
let audio = null;

/* ===== PROGRESS (TCK exit/resume) ===== */
const TCK_TASK = 'conv';
const TCK_PRACTICE = 1;
const MENU_URL = '../menu.html';
function snapshotState(){ return { currentConv: currentConv, currentQ: currentQ, userAnswers: userAnswers }; }
function restoreState(saved){
    try {
        userAnswers = saved.userAnswers || [null,null,null,null];
        document.getElementById('startOverlay').classList.add('hidden');
        var qIdx = (typeof saved.currentQ === 'number' && saved.currentQ >= 0) ? saved.currentQ : 0;
        if(qIdx >= questions.length) qIdx = questions.length - 1;
        showQuestion(qIdx);
    } catch(e){ startListening(); }
}
window.addEventListener('DOMContentLoaded', function(){
    if(window.TCKProgress){
        TCKProgress.mountExitButton(TCK_TASK, TCK_PRACTICE, snapshotState, MENU_URL);
        if(TCKProgress.hasSaved(TCK_TASK, TCK_PRACTICE)){
            TCKProgress.promptResume(TCK_TASK, TCK_PRACTICE, {
                onResume: restoreState,
                onRestart: function(){}
            });
        }
    }
});

function startListening(){
    document.getElementById('startOverlay').classList.add('hidden');
    var ov=document.createElement('div');ov.id='cdOverlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:90;color:#fff;font-size:96px;font-weight:800;font-family:Manrope,sans-serif;';ov.textContent='3';document.body.appendChild(ov);var n=3;var iv=setInterval(function(){n--;if(n>0){ov.textContent=String(n);}else{clearInterval(iv);if(ov.parentNode)ov.parentNode.removeChild(ov);playConversation(0);}},1000);
}

function playConversation(idx){
    currentConv = idx;
    document.getElementById('audioPhase').style.display = 'flex';
    document.getElementById('questionPhase').style.display = 'none';
    document.getElementById('completionPage').style.display = 'none';
    document.getElementById('audioImg').src = convImages[idx];
    document.getElementById('audioStatus').innerHTML = '<span class="pulse"></span> Listen to a conversation...';
    document.getElementById('audioStatus').style.display = 'flex';
    document.getElementById('btnNext').classList.remove('active');
    document.getElementById('qInfo').textContent = 'Listen to a Conversation';
    document.getElementById('timer').textContent = '--:--';
    document.getElementById('timer').classList.remove('warning');

    if(!convAudio[idx]){
        /* No audio yet -- skip to first question after brief delay */
        setTimeout(function(){
            var firstQ = 0;
            for(var i=0;i<questions.length;i++){ if(questions[i].conv===idx){ firstQ=i; break; } }
            showQuestion(firstQ);
        }, 2000);
        return;
    }
    audio = new Audio(convAudio[idx]);
    var _revealed=false,_fbTimer=null;
    function _reveal(){
        if(_revealed)return; _revealed=true;
        if(_fbTimer){clearTimeout(_fbTimer);_fbTimer=null;}
        var firstQ = 0;
        for(var i=0;i<questions.length;i++){ if(questions[i].conv===idx){ firstQ=i; break; } }
        showQuestion(firstQ);
    }
    audio.addEventListener('ended', _reveal);
    audio.addEventListener('error', function(){
        document.getElementById('audioStatus').innerHTML =
            '<button onclick="retryAudio()" style="padding:10px 24px;background:#007646;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Play Conversation</button>';
        if(_fbTimer)clearTimeout(_fbTimer); _fbTimer=setTimeout(_reveal,4000);
    });
    audio.addEventListener('loadedmetadata', function(){
        var d=audio.duration; if(isFinite(d)&&d>0){ if(_fbTimer)clearTimeout(_fbTimer); _fbTimer=setTimeout(_reveal,(d+6)*1000); }
    });
    audio.play().catch(function(e){
        document.getElementById('audioStatus').innerHTML =
            '<button onclick="retryAudio()" style="padding:10px 24px;background:#007646;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Play Conversation</button>';
        if(_fbTimer)clearTimeout(_fbTimer); _fbTimer=setTimeout(_reveal,6000);
    });
    if(!_fbTimer) _fbTimer=setTimeout(_reveal,90000);
}

function retryAudio(){
    document.getElementById('audioStatus').innerHTML = '<span class="pulse"></span> Listen to a conversation...';
    if(audio) audio.play();
}

function showQuestion(qIdx){
    currentQ = qIdx;
    if(window.TCKDifficulty)TCKDifficulty.setForIndex(qIdx,[2,3]);
    var q = questions[qIdx];
    document.getElementById('audioPhase').style.display = 'none';
    document.getElementById('questionPhase').style.display = 'flex';
    document.getElementById('completionPage').style.display = 'none';
    document.getElementById('qImg').src = convImages[q.conv];
    document.getElementById('qLabel').textContent = 'Question '+(qIdx+1)+' of 4';
    document.getElementById('qText').textContent = q.text;
    document.getElementById('qInfo').innerHTML = 'Question <strong>'+(qIdx+1)+'</strong> of 4 | Listening';
    document.getElementById('progressFill').style.width = (25*(qIdx+1))+'%';

    var container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    q.options.forEach(function(opt, i){
        var div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = '<span class="opt-letter">'+labels[i]+'</span><span class="opt-text">'+opt+'</span>';
        div.onclick = function(){
            container.querySelectorAll('.option').forEach(function(o){ o.classList.remove('selected'); });
            div.classList.add('selected');
            userAnswers[qIdx] = i;
            document.getElementById('btnNext').classList.add('active');
            if(window.TCKProgress) TCKProgress.save(TCK_TASK, TCK_PRACTICE, snapshotState());
        };
        container.appendChild(div);
    });

    if(userAnswers[qIdx] !== null){
        document.getElementById('btnNext').classList.add('active');
    } else {
        document.getElementById('btnNext').classList.remove('active');
    }
    startTimer(20);
}

function startTimer(secs){
    clearInterval(timerInterval);
    secondsLeft = secs;
    updateTimer();
    timerInterval = setInterval(function(){
        secondsLeft--;
        updateTimer();
        if(secondsLeft <= 5) document.getElementById('timer').classList.add('warning');
        if(secondsLeft <= 0){ clearInterval(timerInterval); nextStep(); }
    }, 1000);
}

function updateTimer(){
    var t = document.getElementById('timer');
    t.textContent = '0:'+String(secondsLeft).padStart(2,'0');
    if(secondsLeft > 5) t.classList.remove('warning');
}

function nextStep(){
    clearInterval(timerInterval);
    document.getElementById('timer').classList.remove('warning');
    if(window.TCKProgress) TCKProgress.save(TCK_TASK, TCK_PRACTICE, snapshotState());
    var nextQ = currentQ + 1;
    if(nextQ >= questions.length){ showCompletion(); return; }
    if(questions[nextQ].conv !== questions[currentQ].conv){
        playConversation(questions[nextQ].conv);
    } else {
        showQuestion(nextQ);
    }
}

function showCompletion(){
    if(window.TCKProgress) TCKProgress.clear(TCK_TASK, TCK_PRACTICE);
    document.getElementById('audioPhase').style.display = 'none';
    document.getElementById('questionPhase').style.display = 'none';
    document.getElementById('completionPage').style.display = 'flex';
    document.getElementById('btnNext').style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('timer').textContent = '';
    document.getElementById('qInfo').textContent = 'Results';

    var correct = 0;
    var grid = document.getElementById('resultGrid');
    grid.innerHTML = '';
    questions.forEach(function(q, i){
        var isCorrect = userAnswers[i] === q.correct;
        if(isCorrect) correct++;
        var div = document.createElement('div');
        div.className = 'result-item '+(isCorrect ? 'correct' : 'incorrect');
        var userAns = userAnswers[i] !== null ? labels[userAnswers[i]] : '\u2014';
        div.innerHTML = (isCorrect ? '\u2705' : '\u274c')+' Q'+(i+1)+': '+userAns+(isCorrect ? '' : ' \u2192 '+labels[q.correct]);
        grid.appendChild(div);
    });
    document.getElementById('scoreDisplay').textContent = correct+' / 4';
    var harderCorrect = 0, harderTotal = 0;
    [2,3].forEach(function(idx){ harderTotal++; if(userAnswers[idx] === questions[idx].correct) harderCorrect++; });
    try{sessionStorage.setItem('training_answers_conv_p1',JSON.stringify(userAnswers));}catch(e){}
    try{sessionStorage.setItem('training_score_conv_p1',JSON.stringify({correct:correct,total:4,harderCorrect:harderCorrect,harderTotal:harderTotal,updatedAt:new Date().toISOString()}));}catch(e){}
    sessionStorage.setItem('convAnswers', JSON.stringify(userAnswers));
    document.getElementById('answersBtn').style.display = 'inline-block';
}
</script>
