*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope','Zen Kaku Gothic New','Noto Sans JP',sans-serif;background:#FBF6EC;min-height:100vh;display:flex;flex-direction:column;}
.top-nav{background:#002817;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;font-size:14px;flex-shrink:0;}
.nav-left{display:flex;align-items:center;gap:12px;}
.nav-left .section-label{font-weight:700;font-size:15px;}
.nav-left .divider{color:#5A6861;}
.nav-left .q-info{color:#5A6861;}
.nav-right{display:flex;align-items:center;gap:14px;}
.timer{font-family:'Courier New',monospace;font-size:15px;font-weight:700;min-width:40px;text-align:center;}
.timer.warning{color:#fc8181;animation:blink .5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.user-badge{width:28px;height:28px;border-radius:50%;background:#007646;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
.progress-bar{height:4px;background:#F5E9D3;flex-shrink:0;}
.progress-fill{height:100%;background:#007646;transition:width .3s;}
.start-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;}
.start-overlay.hidden{display:none;}
.start-card{background:#fff;border-radius:16px;padding:48px;text-align:center;max-width:500px;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.start-card h2{font-size:22px;color:#0F1511;margin-bottom:12px;}
.start-card p{color:#5A6861;font-size:14px;margin-bottom:24px;line-height:1.6;}
.btn-start{background:#007646;color:#fff;border:none;padding:14px 40px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;}
.btn-start:hover{background:#3a7cc0;}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.audio-phase{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:#fff;margin:16px 24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.audio-phase img{max-height:480px;width:auto;border-radius:10px;object-fit:contain;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.audio-status{margin-top:20px;display:flex;align-items:center;gap:10px;font-size:15px;color:#007646;font-weight:600;}
.pulse{width:10px;height:10px;border-radius:50%;background:#007646;animation:pulse-a 1s infinite;}
@keyframes pulse-a{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.3);}}
.question-phase{flex:1;display:none;margin:16px 24px;min-height:0;}
.q-split{display:flex;gap:0;flex:1;min-height:100%;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;}
.q-left{width:50%;display:flex;align-items:center;justify-content:center;padding:32px;background:#FBF6EC;border-right:1px solid #F5E9D3;}
.q-left img{max-height:500px;max-width:100%;border-radius:10px;object-fit:contain;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.q-right{width:50%;padding:32px 40px;display:flex;flex-direction:column;justify-content:center;}
.q-label{font-size:12px;color:#007646;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.q-text{font-size:17px;color:#0F1511;font-weight:600;margin-bottom:24px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{display:flex;align-items:center;gap:14px;padding:14px 18px;border:2px solid #F5E9D3;border-radius:10px;cursor:pointer;transition:all .15s;font-size:14px;color:#5A6861;background:#fff;}
.option:hover{border-color:#007646;background:#F5E9D3;}
.option.selected{border-color:#007646;background:#F5E9D3;}
.option.selected .opt-letter{background:#007646;color:#fff;}
.opt-letter{width:28px;height:28px;border-radius:50%;border:2px solid #D6DAD7;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#5A6861;flex-shrink:0;transition:all .15s;}
.opt-text{flex:1;line-height:1.4;}
.completion{flex:1;display:none;align-items:center;justify-content:center;padding:40px;}
.completion-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);max-width:600px;width:100%;padding:40px;text-align:center;}
.completion-card h2{font-size:22px;color:#0F1511;margin:12px 0 8px;}
.score-display{font-size:48px;font-weight:700;color:#007646;margin:16px 0;}
.result-grid{text-align:left;margin:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.result-item{padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;}
.result-item.correct{background:#f0fff4;color:#276749;}
.result-item.incorrect{background:#FDF4F0;color:#8A3E24;}
.btn-answers{display:inline-block;margin-top:20px;padding:14px 36px;background:#007646;color:#fff;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;}
.btn-answers:hover{background:#3a7cc0;}
.footer-nav{background:#fff;border-top:1px solid #F5E9D3;padding:12px 24px;display:flex;justify-content:flex-end;align-items:center;flex-shrink:0;}
.btn-next{padding:10px 28px;background:#007646;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;opacity:.5;pointer-events:none;transition:opacity .2s;}
.btn-next.active{opacity:1;pointer-events:auto;}
.btn-next:hover{background:#3a7cc0;}
</style>

/* ===== AUDIO FILES (placeholder) ===== */
const audioFiles = {"instruction": "../../audio/announce/practice-4/instruction.mp3",ann1:"../../audio/announce/practice-4/audio_1.mp3",ann2:"../../audio/announce/practice-4/audio_2.mp3"};

/* ===== QUESTIONS ===== */
const questions = [
  {ann:0, text:"What is the announcement mainly about?",
   options:["Flu season precautions and free vaccinations on campus.","New health center operating hours.","A new health insurance policy for students.","A volunteer recruitment for a medical study."],
   correct:0},
  {ann:0, text:"Why does the health center ask students to call before visiting if they have symptoms?",
   options:["To verify the student's insurance coverage.","To allow staff to take proper precautions.","To schedule a mandatory appointment.","To confirm the student's identity."],
   correct:1},
  {ann:1, text:"Why is the professor canceling class?",
   options:["The classroom is being renovated.","The professor is sick.","The professor is attending a conference.","A university holiday is scheduled."],
   correct:2},
  {ann:1, text:"What can be inferred about the professor's availability during the trip?",
   options:["The professor will be completely unreachable.","The professor will hold virtual office hours.","The professor will check email regularly.","The professor may take longer than usual to reply to emails."],
   correct:3}
];

/* ===== STATE ===== */
const labels = ['A','B','C','D'];
let currentQ = -1;
let currentAnn = -1;
let userAnswers = [null,null,null,null];
let timerInterval = null;
let secondsLeft = 0;
let audio = null;
let instrPlayed = false;

/* ===== PROGRESS (TCK exit/resume) ===== */
const TCK_TASK = 'announce';
const TCK_PRACTICE = 4;
const MENU_URL = '../menu.html';
function snapshotState(){
  return {
    currentQ: currentQ,
    currentAnn: currentAnn,
    userAnswers: userAnswers,
    instrPlayed: instrPlayed
  };
}
function restoreState(saved){
  try {
    userAnswers = saved.userAnswers || [null,null,null,null];
    instrPlayed = saved.instrPlayed || true;
    document.getElementById('startOverlay').classList.add('hidden');
    const qIdx = (typeof saved.currentQ === 'number' && saved.currentQ >= 0) ? saved.currentQ : 0;
    showQuestion(Math.min(qIdx, questions.length - 1));
  } catch(e){ showQuestion(0); }
}
window.addEventListener('DOMContentLoaded', function(){
  if(window.TCKProgress){
    TCKProgress.mountExitButton(TCK_TASK, TCK_PRACTICE, snapshotState, MENU_URL);
  }
});

/* ===== CHECK URL PARAM / RESUME ===== */
window.addEventListener('DOMContentLoaded', function(){
  if(window.TCKProgress && TCKProgress.hasSaved(TCK_TASK, TCK_PRACTICE)){
    TCKProgress.promptResume(TCK_TASK, TCK_PRACTICE, {
      onResume: restoreState,
      onRestart: function(){}
    });
  }
});


function startListening(){
  document.getElementById('startOverlay').classList.add('hidden');
  // Play instruction first
  audio = new Audio(audioFiles.instruction);
  document.getElementById('audioPhase').style.display = 'flex';
  document.getElementById('audioImg').style.display = 'none';
  document.getElementById('audioStatus').innerHTML = '<span class="pulse"></span> Listen to the instructions...';
  document.getElementById('qInfo').textContent = 'Instructions';

  audio.addEventListener('ended', () => { instrPlayed = true; var __ov=document.createElement('div');__ov.id='cdOverlay';__ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:90;color:#fff;font-size:96px;font-weight:800;font-family:Manrope,sans-serif;';__ov.textContent='3';document.body.appendChild(__ov);var __n=3;var __iv=setInterval(function(){__n--;if(__n>0){__ov.textContent=String(__n);}else{clearInterval(__iv);if(__ov.parentNode)__ov.parentNode.removeChild(__ov);playAnnouncement(0);}},1000); });
  audio.play().catch(e => {
    console.log('Autoplay blocked:', e);
    document.getElementById('audioStatus').innerHTML = '<button onclick="retryInstr()" style="padding:10px 24px;background:#007646;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">\u25b6 Play Instructions</button>';
  });
}

function retryInstr(){
  document.getElementById('audioStatus').innerHTML = '<span class="pulse"></span> Listen to the instructions...';
  if(audio) audio.play();
}

function playAnnouncement(idx){
  currentAnn = idx;
  document.getElementById('audioPhase').style.display = 'flex';
  document.getElementById('questionPhase').style.display = 'none';
  document.getElementById('completionPage').style.display = 'none';
  document.getElementById('audioImg').style.display = 'block';
  document.getElementById('audioImg').src = speakerImages[idx];
  document.getElementById('audioStatus').innerHTML = '<span class="pulse"></span> Listen to the announcement...';
  document.getElementById('btnNext').classList.remove('active');
  document.getElementById('qInfo').textContent = 'Listen to an Announcement';
  document.getElementById('timer').textContent = '--:--';
  document.getElementById('timer').classList.remove('warning');

  const key = 'ann' + (idx+1);
  audio = new Audio(audioFiles[key]);
  audio.addEventListener('ended', () => {
    showQuestion(idx * 2);
  });
  audio.play().catch(e => {
    document.getElementById('audioStatus').innerHTML = '<button onclick="retryAnn()" style="padding:10px 24px;background:#007646;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">\u25b6 Play Announcement</button>';
  });
}

function retryAnn(){
  document.getElementById('audioStatus').innerHTML = '<span class="pulse"></span> Listen to the announcement...';
  if(audio) audio.play();
}

function showQuestion(qIdx){
  currentQ = qIdx;
  const q = questions[qIdx];

  document.getElementById('audioPhase').style.display = 'none';
  document.getElementById('questionPhase').style.display = 'flex';
  document.getElementById('completionPage').style.display = 'none';

  document.getElementById('qImg').src = speakerImages[q.ann];
  document.getElementById('qLabel').textContent = 'Question ' + (qIdx+1) + ' of 4';
  document.getElementById('qText').textContent = q.text;
  document.getElementById('qInfo').innerHTML = 'Question <strong>' + (qIdx+1) + '</strong> of 4 | Listening';
  document.getElementById('progressFill').style.width = (25*(qIdx+1)) + '%';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<span class="opt-letter">' + labels[i] + '</span><span class="opt-text">' + opt + '</span>';
    div.onclick = () => {
      container.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      div.classList.add('selected');
      userAnswers[qIdx] = i;
      document.getElementById('btnNext').classList.add('active');
      if(window.TCKProgress) TCKProgress.save(TCK_TASK, TCK_PRACTICE, snapshotState());
    };
    container.appendChild(div);
  });

  document.getElementById('btnNext').classList.remove('active');
  startTimer(20);
}

function startTimer(secs){
  clearInterval(timerInterval);
  secondsLeft = secs;
  updateTimer();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimer();
    if(secondsLeft <= 5) document.getElementById('timer').classList.add('warning');
    if(secondsLeft <= 0){
      clearInterval(timerInterval);
      nextStep();
    }
  }, 1000);
}

function updateTimer(){
  const t = document.getElementById('timer');
  t.textContent = '0:' + String(secondsLeft).padStart(2,'0');
  if(secondsLeft > 5) t.classList.remove('warning');
}

function nextStep(){
  clearInterval(timerInterval);
  document.getElementById('timer').classList.remove('warning');

  if(window.TCKProgress) TCKProgress.save(TCK_TASK, TCK_PRACTICE, snapshotState());

  const nextQ = currentQ + 1;
  if(nextQ >= questions.length){
    showCompletion();
    return;
  }
  if(questions[nextQ].ann !== questions[currentQ].ann){
    playAnnouncement(questions[nextQ].ann);
  } else {
    showQuestion(nextQ);
  }
}

function showCompletion(){
  if(window.TCKProgress) TCKProgress.clear(TCK_TASK, TCK_PRACTICE);
  document.getElementById('audioPhase').style.display = 'none';
  document.getElementById('questionPhase').style.display = 'none';
  document.getElementById('completionPage').style.display = 'flex';
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('timer').textContent = '';
  document.getElementById('qInfo').textContent = 'Results';

  let correct = 0;
  const grid = document.getElementById('resultGrid');
  grid.innerHTML = '';

  questions.forEach((q, i) => {
    const isCorrect = userAnswers[i] === q.correct;
    if(isCorrect) correct++;
    const div = document.createElement('div');
    div.className = 'result-item ' + (isCorrect ? 'correct' : 'incorrect');
    const userAns = userAnswers[i] !== null ? labels[userAnswers[i]] : '\u2014';
    div.innerHTML = (isCorrect ? '\u2705' : '\u274c') + ' Q' + (i+1) + ': ' + userAns + (isCorrect ? '' : ' \u2192 ' + labels[q.correct]);
    grid.appendChild(div);
  });

  document.getElementById('scoreDisplay').textContent = correct + ' / 4';
  try{sessionStorage.setItem('training_answers_announce_p4',JSON.stringify(userAnswers));}catch(e){}
  try{sessionStorage.setItem('training_score_announce_p4',JSON.stringify({correct:correct,total:4,harderCorrect:0,harderTotal:0,updatedAt:new Date().toISOString()}));}catch(e){}
  sessionStorage.setItem('announceAnswers', JSON.stringify(userAnswers));
  document.getElementById('answersBtn').style.display = 'inline-block';
}
</script>
