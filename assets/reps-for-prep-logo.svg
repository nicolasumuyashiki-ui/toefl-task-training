<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="1400" height="580" role="img" aria-label="Reps for Prep — TOEFL iBT 対策タスクトレーニング">
  <defs>
    <linearGradient id="topbarA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007646"/><stop offset="1" stop-color="#C9A961"/>
    </linearGradient>
    <clipPath id="cardA"><rect x="2" y="2" width="1396" height="576" rx="28"/></clipPath>
  </defs>
  <rect x="2" y="2" width="1396" height="576" rx="28" fill="#ffffff" stroke="#E8E4D8" stroke-width="2"/>
  <g clip-path="url(#cardA)"><rect x="0" y="0" width="1400" height="12" fill="url(#topbarA)"/></g>

  <text x="700" y="170" text-anchor="middle"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="14" fill="#007646">TCK WORKSHOP</text>

  <!-- Variant A: Reps = geometric sans (800) / Prep = serif display (700) -->
  <text x="700" y="375" text-anchor="middle" fill="#002817">
    <tspan font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="155" font-weight="800">Reps</tspan>
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="80" fill="#007646"> for </tspan>
    <tspan font-family="Georgia, 'Times New Roman', serif" font-size="155" font-weight="700">Prep</tspan>
    <tspan font-family="Georgia, serif" font-size="155" font-weight="700" fill="#007646">.</tspan>
  </text>

  <text x="700" y="462" text-anchor="middle"
        font-family="Manrope, 'Hiragino Kaku Gothic ProN', 'Zen Kaku Gothic New', sans-serif"
        font-size="46" font-weight="600" fill="#5B6660">TOEFL iBT® 対策タスクトレーニング</text>
</svg>
