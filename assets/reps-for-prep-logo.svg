<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="1400" height="580" role="img" aria-label="Reps for Prep — TOEFL iBT 対策タスクトレーニング">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007646"/>
      <stop offset="1" stop-color="#C9A961"/>
    </linearGradient>
    <clipPath id="cardclip">
      <rect x="2" y="2" width="1396" height="576" rx="28"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="1396" height="576" rx="28" fill="#ffffff" stroke="#E8E4D8" stroke-width="2"/>
  <!-- Top accent bar -->
  <g clip-path="url(#cardclip)">
    <rect x="0" y="0" width="1400" height="12" fill="url(#topbar)"/>
  </g>

  <!-- Eyebrow -->
  <text x="700" y="170" text-anchor="middle"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="14" fill="#007646">TCK WORKSHOP</text>

  <!-- Wordmark -->
  <text x="700" y="370" text-anchor="middle"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="150" font-weight="800" fill="#002817">Reps<tspan font-weight="600" font-size="110" fill="#007646"> for </tspan>Prep<tspan fill="#007646">.</tspan></text>

  <!-- Descriptive subtitle (TOEFL used descriptively, with ® per ETS policy) -->
  <text x="700" y="460" text-anchor="middle"
        font-family="Manrope, 'Hiragino Kaku Gothic ProN', 'Zen Kaku Gothic New', sans-serif"
        font-size="46" font-weight="600" fill="#5B6660">TOEFL iBT® 対策タスクトレーニング</text>
</svg>
