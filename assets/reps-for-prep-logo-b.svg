<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="1400" height="580" role="img" aria-label="Reps for Prep — TOEFL iBT 対策タスクトレーニング">
  <defs>
    <linearGradient id="topbarB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007646"/><stop offset="1" stop-color="#C9A961"/>
    </linearGradient>
    <clipPath id="cardB"><rect x="2" y="2" width="1396" height="576" rx="28"/></clipPath>
  </defs>
  <rect x="2" y="2" width="1396" height="576" rx="28" fill="#ffffff" stroke="#E8E4D8" stroke-width="2"/>
  <g clip-path="url(#cardB)"><rect x="0" y="0" width="1400" height="12" fill="url(#topbarB)"/></g>

  <text x="700" y="170" text-anchor="middle"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="14" fill="#007646">TCK WORKSHOP</text>

  <!-- Variant B: "REPS" chip (echoes old TOEFL chip) + "for Prep." display -->
  <g>
    <rect x="300" y="262" width="300" height="128" rx="20" fill="#002817"/>
    <text x="450" y="356" text-anchor="middle"
          font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
          font-size="86" font-weight="900" letter-spacing="6" fill="#ffffff">REPS</text>
    <text x="628" y="370" text-anchor="start"
          font-family="Georgia, 'Times New Roman', serif" font-style="italic"
          font-size="78" font-weight="400" fill="#007646">for</text>
    <text x="772" y="375" text-anchor="start"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="150" font-weight="700" fill="#002817">Prep<tspan fill="#007646">.</tspan></text>
  </g>

  <text x="700" y="470" text-anchor="middle"
        font-family="Manrope, 'Hiragino Kaku Gothic ProN', 'Zen Kaku Gothic New', sans-serif"
        font-size="46" font-weight="600" fill="#5B6660">TOEFL iBT® 対策タスクトレーニング</text>
</svg>
