<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope','Zen Kaku Gothic New','Noto Sans JP',sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;color:#0F1511;line-height:1.7}
.top-nav{background:#fff;border-bottom:1px solid #F5E9D3;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}.top-nav-left{display:flex;align-items:center;gap:16px;font-size:.9em;color:#5A6861}.top-nav-left strong{color:#0F1511}.top-nav-right{display:flex;align-items:center;gap:12px}
.timer-btn{background:none;border:1px solid #D6DAD7;border-radius:6px;padding:6px 14px;font-size:.85em;color:#5A6861;cursor:pointer;font-family:inherit}.timer-btn:hover{background:#FBF6EC}.timer-display{font-family:'Courier New',monospace;font-size:.9em;color:#0F1511;font-weight:600;min-width:60px;text-align:center}
.review-btn{background:#007646;color:#fff;border:none;border-radius:14px;padding:6px 18px;font-size:.85em;cursor:pointer;font-family:inherit;font-weight:600}.review-btn:hover{background:#004D2E}

.progress-bar{height:4px;background:#F5E9D3;width:100%}.progress-fill{height:100%;width:100%;background:#007646;border-radius:2px}

.direction{font-weight:700;font-size:1em;color:#0F1511;margin-bottom:24px}
.set-label{display:inline-block;background:#F5E9D3;color:#007646;font-size:.78em;font-weight:600;padding:3px 12px;border-radius:10px;margin-bottom:12px}
.passage{font-size:.95em;line-height:2.2;color:#0F1511}.word-blank{display:inline-block;white-space:nowrap}.sh{font-size:.95em}
.bx{display:inline-block;width:1.5em;height:1.9em;border:1px solid #bbb;border-radius:2px;background:#F5E9D3;text-align:center;vertical-align:baseline;margin:0 .5px;position:relative}
.bx input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-size:1em;font-family:inherit;outline:none;padding:0;color:#0F1511}.bx:focus-within{background:#F5E9D3;border-color:#007646}
.reading-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #F5E9D3;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100}

.btn-menu{color:#5A6861;background:none;border:1px solid #F5E9D3;font-size:.82em;padding:8px 14px;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer}.btn-menu:hover{background:#FBF6EC}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;justify-content:center;align-items:center}.overlay.active{display:flex}
.review-panel{background:#fff;border-radius:12px;width:90%;max-width:520px;max-height:80vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.review-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #F5E9D3}.review-header h3{font-size:1em;color:#0F1511}
.review-close{background:none;border:none;font-size:1.3em;cursor:pointer;color:#5A6861;padding:4px 8px;border-radius:4px}.review-close:hover{background:#FBF6EC}
.review-body{padding:20px;max-height:50vh;overflow-y:auto}
.review-row{display:flex;padding:10px 0;border-bottom:1px solid #F5E9D3;align-items:center;font-size:.88em}
.review-no{width:28px;color:#5A6861;font-weight:500}.review-word{flex:1;color:#0F1511}
.review-status{font-size:.78em;padding:2px 10px;border-radius:10px}.review-status.filled{background:#A8C9B8;color:#004D2E}.review-status.empty{background:#F3DDD4;color:#8A3E24}
.set-progress{padding:16px 20px;border-top:1px solid #F5E9D3;background:#FBF6EC;display:flex;justify-content:center}
.set-progress-row{display:flex;gap:8px;align-items:center}
.set-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:700}
.set-dot.done{background:#A8C9B8;color:#004D2E}.set-dot.current{background:#007646;color:#fff}.set-dot.upcoming{background:#F5E9D3;color:#5A6861}
.set-dot-line{width:40px;height:2px;background:#F5E9D3}
</style>

<body>
<div class="top-nav"><div class="top-nav-left"><span>Set <strong>3</strong> of 3</span><span>Complete the Words</span></div><div class="top-nav-right"><button class="timer-btn" id="timerToggle">Hide Time</button><span class="timer-display" id="timerDisplay">36:00</span><button class="review-btn" id="reviewOpen">Review</button><span class="user-badge" id="userBadge"></span></div></div>
<div class="progress-bar"><div class="progress-fill"></div></div>
<div class="main"><div class="content"><span class="set-label">Set 3 / 3 — The Science Behind Earthquake Prediction</span><p class="direction">In the paragraph below, some words are missing letters. Fill in the blanks to complete the words.</p><div class="passage" id="passage"></div></div></div>
<div class="reading-footer"><div></div><div class="footer-right"><button class="btn-nav btn-back" onclick="window.location.href='practice-3-set-2.html'">‹ Back</button><button class="btn-nav btn-next" onclick="goNext()"><span class="jp"><span class="jp">解答解説を見る</span><span class="en">See Answers</span> →</span><span class="en">See Answers →</span></button></div></div>
<div class="overlay" id="overlay"><div class="review-panel"><div class="review-header"><h3>Review — Set 3</h3><button class="review-close" id="reviewClose">&times;</button></div><div class="review-body" id="reviewBody"></div><div class="set-progress"><div class="set-progress-row"><div class="set-dot done">1</div><div class="set-dot-line"></div><div class="set-dot done">2</div><div class="set-dot-line"></div><div class="set-dot current">3</div></div></div></div></div>
<script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/progress.js"></script>
<script>
var SET_NUM=3;var NEXT_PAGE="practice-3-answers.html";var D={"intro": "Earthquakes are among the most destructive natural events on Earth. Scientists have spent decades studying the forces deep underground that cause the ground to shake. Despite significant advances in technology, accurately predicting when and where an earthquake will strike remains one of the greatest challenges in modern geology.", "conclusion": "Although perfect prediction may never be possible, continued research brings scientists closer to understanding these powerful forces of nature.", "target": [{"w": "Researchers", "a": "rchers", "s": "Resea", "p": ""}, {"w": "carefully", "a": null, "s": null, "p": ""}, {"w": "monitor", "a": "itor", "s": "mon", "p": ""}, {"w": "underground", "a": null, "s": null, "p": ""}, {"w": "movements", "a": "ments", "s": "move", "p": ""}, {"w": "using", "a": null, "s": null, "p": ""}, {"w": "sensitive", "a": "itive", "s": "sens", "p": ""}, {"w": "instruments", "a": null, "s": null, "p": ""}, {"w": "that", "a": "at", "s": "th", "p": ""}, {"w": "detect", "a": null, "s": null, "p": ""}, {"w": "vibrations", "a": "ations", "s": "vibr", "p": ""}, {"w": "traveling", "a": null, "s": null, "p": ""}, {"w": "through", "a": "ough", "s": "thr", "p": ""}, {"w": "layers", "a": null, "s": null, "p": ""}, {"w": "of", "a": "f", "s": "o", "p": ""}, {"w": "rock", "a": null, "s": null, "p": ""}, {"w": "however", "a": "ever", "s": "how", "p": ","}, {"w": "these", "a": null, "s": null, "p": ""}, {"w": "signals", "a": "nals", "s": "sig", "p": ""}, {"w": "remain", "a": null, "s": null, "p": "."}]};
if(typeof Auth!=='undefined'){Auth.require();Auth.showBadge('userBadge');}
(function(){var h='<span>'+D.intro+'</span> ';D.target.forEach(function(t){if(t.a!==null){h+='<span class="word-blank"><span class="sh">'+t.s+'</span><span class="boxes">';for(var j=0;j<t.a.length;j++){h+='<span class="bx"><input type="text" maxlength="1" data-idx="'+j+'" autocomplete="off" autocorrect="off" autocapitalize="off" inputmode="latin" lang="en" spellcheck="false"></span>';}h+='</span>';if(t.p)h+=t.p;h+='</span> ';}else{h+=t.w+(t.p||'')+' ';}});h+='<span>'+D.conclusion+'</span>';document.getElementById('passage').innerHTML=h;
var boxes=document.querySelectorAll('.bx input');boxes.forEach(function(inp,i){inp.addEventListener('input',function(){if(this.value.length===1&&i<boxes.length-1)boxes[i+1].focus();});inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&this.value===''&&i>0)boxes[i-1].focus();});});})();
(function(){var s=36*60,el=document.getElementById('timerDisplay'),btn=document.getElementById('timerToggle'),v=true;setInterval(function(){if(s>0)s--;var m=Math.floor(s/60),ss=s%60;el.textContent=m+':'+(ss<10?'0':'')+ss;},1000);btn.addEventListener('click',function(){v=!v;el.style.display=v?'':'none';btn.textContent=v?'Hide Time':'Show Time';});})();
(function(){var ov=document.getElementById('overlay');document.getElementById('reviewOpen').addEventListener('click',function(){ov.classList.add('active');renderReview();});document.getElementById('reviewClose').addEventListener('click',function(){ov.classList.remove('active');});ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('active');});
window.renderReview=function(){var body=document.getElementById('reviewBody');var blanks=D.target.filter(function(t){return t.a!==null;});var ai=document.querySelectorAll('.bx input');var html='',idx=0;blanks.forEach(function(b,i){var ua='';for(var j=0;j<b.a.length;j++){ua+=(ai[idx]?ai[idx].value:'');idx++;}var f=ua.trim().length>0;html+='<div class="review-row"><span class="review-no">'+(i+1)+'</span><span class="review-word">'+b.s+(f?ua:'___')+'</span><span class="review-status '+(f?'filled':'empty')+'">'+(f?'Answered':'Empty')+'</span></div>';});body.innerHTML=html;};})();
function goNext(){var blanks=D.target.filter(function(t){return t.a!==null;});var ai=document.querySelectorAll('.bx input');var idx=0,ua=[],sc=0;blanks.forEach(function(b){var ans='';for(var j=0;j<b.a.length;j++){ans+=(ai[idx]?ai[idx].value:'');idx++;}ua.push(ans);if(ans.toLowerCase()===b.a.toLowerCase())sc++;});sessionStorage.setItem('ctw_p3_answers_'+SET_NUM,JSON.stringify({answers:ua,score:sc,total:blanks.length,words:blanks.map(function(b){return b.w;})}));if(typeof Auth!=='undefined')Auth.completeSet(SET_NUM);if(typeof Api!=='undefined'&&Api.saveAnswers){try{Api.saveAnswers('CTW P3 Set '+SET_NUM,ua,sc);}catch(e){}}if(window.TCKProgress)TCKProgress.clear(TCK_TASK,TCK_PRACTICE_KEY);window.location.href=NEXT_PAGE;}

var TCK_TASK='ctw';var TCK_PRACTICE=3;var TCK_SET=3;var MENU_URL='../menu.html';var TCK_PRACTICE_KEY=TCK_PRACTICE;
function snapshotState(){var vals=[];document.querySelectorAll('.bx input').forEach(function(inp){vals.push(inp.value);});return{setNum:TCK_SET,values:vals};}
function restoreState(saved){if(!saved||saved.setNum!==TCK_SET||!saved.values)return;var inputs=document.querySelectorAll('.bx input');saved.values.forEach(function(v,i){if(inputs[i])inputs[i].value=v;});}
window.addEventListener('DOMContentLoaded',function(){if(window.TCKProgress){TCKProgress.mountExitButton(TCK_TASK,TCK_PRACTICE_KEY,snapshotState,MENU_URL);if(TCKProgress.hasSaved(TCK_TASK,TCK_PRACTICE_KEY)){TCKProgress.promptResume(TCK_TASK,TCK_PRACTICE_KEY,{onResume:function(saved){restoreState(saved);},onRestart:function(){}});}document.querySelectorAll('.bx input').forEach(function(inp){inp.addEventListener('input',function(){TCKProgress.save(TCK_TASK,TCK_PRACTICE_KEY,snapshotState());});});}});
</script></body></html>
