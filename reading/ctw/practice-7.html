<link rel="stylesheet" href="../../css/common.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Nunito',sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;color:#2d3748;line-height:1.7}
.top-nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}.top-nav-left{display:flex;align-items:center;gap:16px;font-size:.9em;color:#4a5568}.top-nav-left strong{color:#2d3748}.top-nav-right{display:flex;align-items:center;gap:12px}
.timer-btn{background:none;border:1px solid #cbd5e0;border-radius:6px;padding:6px 14px;font-size:.85em;color:#4a5568;cursor:pointer;font-family:inherit}.timer-btn:hover{background:#f7fafc}.timer-display{font-family:'Courier New',monospace;font-size:.9em;color:#2d3748;font-weight:600;min-width:60px;text-align:center}
.review-btn{background:#4a90d9;color:#fff;border:none;border-radius:14px;padding:6px 18px;font-size:.85em;cursor:pointer;font-family:inherit;font-weight:600}.review-btn:hover{background:#3a7bc8}
.user-badge{font-size:.8em;color:#718096}.user-badge strong{color:#2d3748}

.direction{font-weight:700;font-size:1em;color:#2d3748;margin-bottom:24px}
.set-label{display:inline-block;background:#ebf4ff;color:#4a90d9;font-size:.78em;font-weight:600;padding:3px 12px;border-radius:10px;margin-bottom:12px}
.passage{font-size:.95em;line-height:2.2;color:#2d3748}.word-blank{display:inline-block;white-space:nowrap}.sh{font-size:.95em}
.bx{display:inline-block;width:1.5em;height:1.9em;border:1px solid #bbb;border-radius:2px;background:#ececec;text-align:center;vertical-align:baseline;margin:0 .5px;position:relative}
.bx input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-size:1em;font-family:inherit;outline:none;padding:0;color:#2d3748}.bx:focus-within{background:#dce8f7;border-color:#4a90d9}
.reading-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.footer-left{font-size:.82em;color:#718096}.footer-right{display:flex;gap:12px}
.btn-nav{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;font-size:.95em;font-family:inherit;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:all .2s}
.btn-back{color:#4a5568;background:#fff;border:1px solid #e2e8f0}.btn-back:hover{background:#f7fafc}
.btn-next{color:#fff;background:#2d3748}.btn-next:hover{opacity:.9}
.btn-menu{color:#5a6878;background:none;border:1px solid #dfe3e8;font-size:.82em;padding:8px 14px;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer}.btn-menu:hover{background:#f5f7fa}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;justify-content:center;align-items:center}.overlay.active{display:flex}
.review-panel{background:#fff;border-radius:12px;width:90%;max-width:520px;max-height:80vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.review-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #e2e8f0}.review-header h3{font-size:1em;color:#2d3748}
.review-close{background:none;border:none;font-size:1.3em;cursor:pointer;color:#718096;padding:4px 8px;border-radius:4px}.review-close:hover{background:#f7fafc}
.review-body{padding:20px;max-height:50vh;overflow-y:auto}
.review-row{display:flex;padding:10px 0;border-bottom:1px solid #f0f0f0;align-items:center;font-size:.88em}
.review-no{width:28px;color:#718096;font-weight:500}.review-word{flex:1;color:#2d3748}
.review-status{font-size:.78em;padding:2px 10px;border-radius:10px}.review-status.filled{background:#c6f6d5;color:#22543d}.review-status.empty{background:#fed7d7;color:#9b2c2c}
.set-progress{padding:16px 20px;border-top:1px solid #e2e8f0;background:#f9fafb;display:flex;justify-content:center}
.set-progress-row{display:flex;gap:8px;align-items:center}
.set-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:700}
.set-dot.done{background:#c6f6d5;color:#22543d}.set-dot.current{background:#4a90d9;color:#fff}.set-dot.upcoming{background:#e2e8f0;color:#718096}
.set-dot-line{width:40px;height:2px;background:#e2e8f0}
</style>
</head>
<body>
<div class="top-nav"><div class="top-nav-left"><span>Set <strong id="setLabel">1</strong> of 3</span><span>Complete the Words</span></div><div class="top-nav-right"><button class="timer-btn" id="timerToggle">Hide Time</button><span class="timer-display" id="timerDisplay">36:00</span><button class="review-btn" id="reviewOpen">Review</button><span class="user-badge" id="userBadge"></span></div></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:33%"></div></div>
<div class="main"><div class="content"><span class="set-label" id="setTitle">Set 1 / 3 — The Role of Bees in Agriculture</span><p class="direction">In the paragraph below, some words are missing letters. Fill in the blanks to complete the words.</p><div class="passage" id="passage"></div></div></div>
<div class="reading-footer"><div><button class="btn-menu" onclick="window.location.href='../menu.html'">&larr; メニューに戻る</button></div><div class="footer-right"><button class="btn-nav btn-back" id="btnBack" style="display:none" onclick="goPrev()">&lsaquo; Back</button><button class="btn-nav btn-next" id="btnNext" onclick="goNext()">Next Set &rsaquo;</button></div></div>
<div class="overlay" id="overlay"><div class="review-panel"><div class="review-header"><h3 id="reviewTitle">Review — Set 1</h3><button class="review-close" id="reviewClose">&times;</button></div><div class="review-body" id="reviewBody"></div><div class="set-progress"><div class="set-progress-row" id="setDots"></div></div></div></div>

<script src="../../js/api.js"></script><script src="../../js/auth.js"></script>
<script>
var SETS=[
{title:"The Role of Bees in Agriculture",intro:"Bees are among the most important creatures in the natural world. They play a vital role in agriculture by transferring pollen between flowering plants. Without bees, many of the fruits and vegetables that people depend on would not grow properly.",conclusion:"Protecting bee populations is therefore essential for maintaining a stable and productive food supply worldwide.",target:[
{w:"Farmers",a:"ers",s:"Farm",p:""},
{w:"rely",a:null,s:null,p:""},
{w:"heavily",a:"vily",s:"hea",p:""},
{w:"on",a:null,s:null,p:""},
{w:"these",a:"ese",s:"th",p:""},
{w:"insects",a:null,s:null,p:""},
{w:"because",a:"ause",s:"bec",p:""},
{w:"they",a:null,s:null,p:""},
{w:"help",a:"lp",s:"he",p:""},
{w:"pollinate",a:null,s:null,p:""},
{w:"crops",a:"ops",s:"cr",p:""},
{w:"such",a:null,s:null,p:""},
{w:"as",a:null,s:null,p:""},
{w:"apples",a:"les",s:"app",p:""},
{w:"and",a:null,s:null,p:""},
{w:"almonds",a:null,s:null,p:""},
{w:"during",a:"ring",s:"du",p:""},
{w:"the",a:null,s:null,p:""},
{w:"spring",a:"ring",s:"sp",p:""},
{w:"season",a:null,s:null,p:"."}
]},
{title:"How Maps Changed Exploration",intro:"For centuries, maps have been essential tools for travelers, traders, and military leaders. Early maps were often inaccurate and incomplete, based more on stories and guesswork than on careful measurement. However, improvements in mapmaking gradually transformed how people understood the world.",conclusion:"These advances in cartography opened new trade routes and helped connect distant civilizations across the globe.",target:[
{w:"Explorers",a:"rers",s:"Explo",p:""},
{w:"used",a:null,s:null,p:""},
{w:"detailed",a:"led",s:"detai",p:""},
{w:"charts",a:null,s:null,p:""},
{w:"to",a:null,s:null,p:""},
{w:"navigate",a:"gate",s:"navi",p:""},
{w:"across",a:null,s:null,p:""},
{w:"dangerous",a:"rous",s:"dange",p:""},
{w:"oceans",a:null,s:null,p:""},
{w:"and",a:null,s:null,p:""},
{w:"they",a:"ey",s:"th",p:""},
{w:"recorded",a:null,s:null,p:""},
{w:"their",a:"eir",s:"th",p:""},
{w:"findings",a:null,s:null,p:""},
{w:"to",a:null,s:null,p:""},
{w:"improve",a:"rove",s:"imp",p:""},
{w:"future",a:null,s:null,p:""},
{w:"voyages",a:"ages",s:"voy",p:""},
{w:"for",a:null,s:null,p:""},
{w:"others",a:null,s:null,p:"."}
]},
{title:"The Physics of Sound Waves",intro:"Sound is a form of energy that travels through matter as a wave. Unlike light, sound cannot travel through a vacuum because it requires a medium such as air, water, or solid material to propagate. The study of sound waves has led to important advances in fields ranging from medicine to engineering.",conclusion:"By understanding how sound behaves in different environments, scientists have developed technologies such as sonar and ultrasound imaging that benefit society in numerous ways.",target:[
{w:"When",a:"en",s:"Wh",p:""},
{w:"an",a:null,s:null,p:""},
{w:"object",a:null,s:null,p:""},
{w:"vibrates",a:"ates",s:"vibr",p:""},
{w:"it",a:null,s:null,p:""},
{w:"produces",a:"uces",s:"prod",p:""},
{w:"disturbances",a:null,s:null,p:""},
{w:"that",a:null,s:null,p:""},
{w:"spread",a:"ead",s:"spr",p:""},
{w:"outward",a:null,s:null,p:""},
{w:"through",a:"ough",s:"thr",p:""},
{w:"the",a:null,s:null,p:""},
{w:"surrounding",a:"ounding",s:"surr",p:""},
{w:"medium",a:null,s:null,p:""},
{w:"and",a:null,s:null,p:""},
{w:"these",a:"ese",s:"th",p:""},
{w:"waves",a:null,s:null,p:""},
{w:"eventually",a:"ually",s:"event",p:""},
{w:"reach",a:null,s:null,p:""},
{w:"our",a:null,s:null,p:""},
{w:"ears",a:null,s:null,p:"."}
]}
];

var currentSet=0;
var allInputValues=[[],[],[]];

function loadSet(idx){
  currentSet=idx;
  var D=SETS[idx];
  document.getElementById('setLabel').textContent=(idx+1);
  document.getElementById('setTitle').textContent='Set '+(idx+1)+' / 3 — '+D.title;
  document.getElementById('reviewTitle').textContent='Review — Set '+(idx+1);
  document.getElementById('progressFill').style.width=Math.round((idx+1)/3*100)+'%';
  document.getElementById('btnBack').style.display=idx>0?'':'none';
  document.getElementById('btnNext').textContent=idx<2?'Next Set \u203A':'View Answers \u203A';

  var h='<span>'+D.intro+'</span> ';
  D.target.forEach(function(t){
    if(t.a!==null){
      h+='<span class="word-blank"><span class="sh">'+t.s+'</span><span class="boxes">';
      for(var j=0;j<t.a.length;j++){
        h+='<span class="bx"><input type="text" maxlength="1" data-idx="'+j+'" autocomplete="off" autocorrect="off" autocapitalize="off" inputmode="latin" lang="en" spellcheck="false"></span>';
      }
      h+='</span>';if(t.p)h+=t.p;h+='</span> ';
    }else{h+=t.w+(t.p||'')+' ';}
  });
  h+='<span>'+D.conclusion+'</span>';
  document.getElementById('passage').innerHTML=h;

  var saved=allInputValues[idx];
  var boxes=document.querySelectorAll('.bx input');
  boxes.forEach(function(inp,i){
    if(saved[i])inp.value=saved[i];
    inp.addEventListener('input',function(){if(this.value.length===1&&i<boxes.length-1)boxes[i+1].focus();});
    inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&this.value===''&&i>0)boxes[i-1].focus();});
  });

  var dots='';
  for(var d=0;d<3;d++){
    if(d>0)dots+='<div class="set-dot-line"></div>';
    var cls=d<idx?'done':d===idx?'current':'upcoming';
    dots+='<div class="set-dot '+cls+'">'+(d+1)+'</div>';
  }
  document.getElementById('setDots').innerHTML=dots;
}

function saveCurrentInputs(){
  var boxes=document.querySelectorAll('.bx input');
  var vals=[];boxes.forEach(function(inp){vals.push(inp.value);});
  allInputValues[currentSet]=vals;
}

function goPrev(){
  saveCurrentInputs();
  if(currentSet>0)loadSet(currentSet-1);
}

function goNext(){
  saveCurrentInputs();
  saveSetToSession(currentSet);
  if(currentSet<2){loadSet(currentSet+1);window.scrollTo(0,0);}
  else{
    var totalCorrect=0,totalQ=0;
    for(var si=0;si<3;si++){
      var raw=sessionStorage.getItem('ctw_p7_answers_'+(si+1));
      if(raw){var d=JSON.parse(raw);totalCorrect+=d.score;totalQ+=d.total;}
    }
    if(totalQ>0)sessionStorage.setItem('training_score_ctw_p7',JSON.stringify({correct:totalCorrect,total:totalQ}));
    window.location.href='practice-7-answers.html';
  }
}

function saveSetToSession(idx){
  var D=SETS[idx];
  var blanks=D.target.filter(function(t){return t.a!==null;});
  var vals=allInputValues[idx];
  var vi=0,ua=[],sc=0;
  blanks.forEach(function(b){
    var ans='';
    for(var j=0;j<b.a.length;j++){ans+=(vals[vi]||'');vi++;}
    ua.push(ans);
    if(ans.toLowerCase()===b.a.toLowerCase())sc++;
  });
  sessionStorage.setItem('ctw_p7_answers_'+(idx+1),JSON.stringify({answers:ua,score:sc,total:blanks.length,words:blanks.map(function(b){return b.w;})}));
}

if(typeof Auth!=='undefined'){Auth.require();Auth.showBadge('userBadge');}

loadSet(0);

(function(){var s=36*60,el=document.getElementById('timerDisplay'),btn=document.getElementById('timerToggle'),v=true;setInterval(function(){if(s>0)s--;var m=Math.floor(s/60),ss=s%60;el.textContent=m+':'+(ss<10?'0':'')+ss;},1000);btn.addEventListener('click',function(){v=!v;el.style.display=v?'':'none';btn.textContent=v?'Hide Time':'Show Time';});})();

(function(){var ov=document.getElementById('overlay');document.getElementById('reviewOpen').addEventListener('click',function(){ov.classList.add('active');renderReview();});document.getElementById('reviewClose').addEventListener('click',function(){ov.classList.remove('active');});ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('active');});
window.renderReview=function(){var body=document.getElementById('reviewBody');var D=SETS[currentSet];var blanks=D.target.filter(function(t){return t.a!==null;});var ai=document.querySelectorAll('.bx input');var html='',idx=0;blanks.forEach(function(b,i){var ua='';for(var j=0;j<b.a.length;j++){ua+=(ai[idx]?ai[idx].value:'');idx++;}var f=ua.trim().length>0;html+='<div class="review-row"><span class="review-no">'+(i+1)+'</span><span class="review-word">'+b.s+(f?ua:'___')+'</span><span class="review-status '+(f?'filled':'empty')+'">'+(f?'Answered':'Empty')+'</span></div>';});body.innerHTML=html;};})();
</script>
</body>
</html>
